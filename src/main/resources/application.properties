
spring.application.name=spring-course
# DATABASE
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/mydatabase}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:password}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.postgresql.Driver}
# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.format_sql=true
# SERVER
server.port=8080

#SECURITY
app.jwt.secret=${JWT_SECRET}
app.jwt.issuer=spring-course

# Caching / Scheduling / Async
app.scheduler.product-stats.fixed-rate=${APP_SCHEDULER_PRODUCT_STATS_FIXED_RATE:60000}
app.scheduler.product-stats.initial-delay=${APP_SCHEDULER_PRODUCT_STATS_INITIAL_DELAY:10000}